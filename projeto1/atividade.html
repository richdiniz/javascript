<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  color: white;
  transition: background-color 0.5s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

.container {
  display: flex;
  align-items: center;
  gap: 40px;
}

button {
  font-size: 40px;
  padding: 15px 25px;
  cursor: pointer;
  border: none;
  border-radius: 12px;
  background: rgba(0,0,0,0.6);
  color: white;
  transition: transform 0.2s;
}

button:hover { transform: scale(1.1); }

.card {
  background: rgba(0, 0, 0, 0.218);
  padding: 30px;
  border-radius: 16px;
  text-align: center;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 150px);
  gap: 15px;
  margin-top: 20px;
}

.grid img {
  width: 150px;
  height: 150px;
  object-fit: contain;
  background: rgba(0, 0, 0, 0.178);
  border-radius: 10px;
}

#descricao {
  margin-top: 40px;
  max-width: 600px;
  text-align: center;
  font-size: 18px;
}
#lore{
  margin-top: 40px;
  max-width: 600px;
  text-align: center;
  font-size: 10px; 
}
</style>
</head>
<body>
    <div class="container">
  <button onclick="anterior()">◀</button>

  <div class="card">
    <h1 id="nome"></h1>
    <div class="grid">
      <img id="img1" src="" alt="">
      <img id="img2" src="" alt="">
      <img id="img3" src="" alt="">
      <img id="img4" src="" alt="">
    </div>
  </div>

  <button onclick="proximo()">▶</button>
</div>

<p id="descricao"></p>
<p id="lore"></p>
<script>
const legioes = [
  {
    nome: "Ultramarines",
    cor: "#0b1f5c",
    descricao: "Courage and Honour!",
    imagens: ["https://m.media-amazon.com/images/I/81W9xp3VreL._UF1000,1000_QL80_.jpg","https://i.pinimg.com/736x/7e/a6/7d/7ea67d4e0c29eca0ead62acf013093f1.jpg","https://i.pinimg.com/1200x/7d/df/f3/7ddff3e746dad7960430fde814fb5163.jpg","https://d1w82usnq70pt2.cloudfront.net/wp-content/uploads/2022/03/gh-ultramarines-icon.png"],
    lore:"Os Ultramarines são considerados um dos Capítulos de Fuzileiros Espaciais mais fortes e honrados do Império da Humanidade , e foram responsáveis ​​por, praticamente sozinhos, manter o Império unido após a Heresia de Horus .Guerreiros altamente disciplinados e corajosos, os Ultramarines permaneceram fiéis aos ensinamentos do Primarca Roboute Guilliman por 10.000 anos padrão. Os Ultramarines eram originalmente a XIII Legião de Fuzileiros Espaciais, antes das reformas que iniciaram a Segunda Fundação e remodelaram o Império após a Heresia, na Era do Renascimento, sob as ordens do próprio Guilliman, como Lorde Comandante do Império e Regente Imperial .O nome 'Ultramarines' é uma referência à região galáctica de origem do Capítulo, à sua posição entre os outros Capítulos dos Space Marines e ao seu papel como fonte do material genético de mais Capítulos do Adeptus Astartes do que todas as outras Legiões da Primeira Fundação juntas.",
  },
  {
    nome: "Blood Angels",
    cor: "#5c0b0b",
    descricao: "For the Angel, for the emperor!",
    imagens: ["https://m.media-amazon.com/images/I/71qli7GZUuL._AC_UF1000,1000_QL80_.jpg","https://i.pinimg.com/1200x/b8/50/d9/b850d9bd0b92559f5045ed1490d3d1ed.jpg","https://i.pinimg.com/1200x/52/ef/d5/52efd598f237c3595e0644823af6c54a.jpg","https://geniusproductions.co.uk/Cetus/images/a/a9/Blood_angels_icon.png"],
    lore:"Os Anjos Sangrentos são uma das 20 Legiões da Primeira Fundação dos Fuzileiros Espaciais e eram originalmente a IX Legião antes da Segunda Fundação dividir as Legiones Astartes em Capítulos separados de 1.000 Fuzileiros Espaciais cada.Eles são bem conhecidos em toda a galáxia por sua natureza sanguinária em batalha e temidos pela maldição da semente genética defeituosa que carregam. Os Anjos Sangrentos estão entre os Adeptus Astartes de vida mais longa , com alguns dos Fuzileiros Espaciais do Capítulo tendo servido ao Imperador da Humanidade por mais de mil anos padrão."
  },
  {
    nome: "Dark Angels",
    cor: "#0b3d1f",
    descricao: "Kill the fallen's!",
    imagens: ["https://m.media-amazon.com/images/S/compressed.photo.goodreads.com/books/1580054618l/52757653.jpg","https://i.pinimg.com/1200x/fa/72/cc/fa72ccc72e30cd0f7ea73b5d74c9d385.jpg","https://i.pinimg.com/1200x/8f/ac/75/8fac75a31761e1b463c96641f25c40d5.jpg","https://d1w82usnq70pt2.cloudfront.net/wp-content/uploads/2022/03/gh-dark-angels-icon.png"],
    lore:"Os Dark Angels são considerados um dos capítulos mais poderosos e secretos dos Space Marines Lealistas . Eles foram a 1ª Legião das 20 Legiões de Space Marines originais a serem criadas durante a Primeira Fundação do 30º Milênio. Embora afirmem lealdade e serviço completos ao Imperador da Humanidade , suas ações e objetivos secretos por vezes parecem contradizer essa lealdade professada, visto que os Anjos Sombrios se esforçam acima de tudo para expiar um antigo crime de traição cometido há mais de 10.000 anos padrão contra a confiança do Imperador durante a época da Heresia de Horus. Os Dark Angels ocupam o primeiro lugar entre os Capítulos dos Space Marines, como têm feito desde a sua criação como a 1ª Legião . São um Capítulo orgulhoso, com tradições e rituais que remontam aos primórdios do Império da Humanidade."
  },
];

let index = 0;

function atualizarTela() {
  const legiao = legioes[index];

document.body.style.background = `linear-gradient(to bottom right, ${legiao.cor}, #000000 85%)`;
document.getElementById("nome").innerText = legiao.nome;
document.getElementById("descricao").innerText = legiao.descricao;
document.getElementById("lore").innerText = legiao.lore;

  document.getElementById("img1").src = legiao.imagens[0];
  document.getElementById("img2").src = legiao.imagens[1];
  document.getElementById("img3").src = legiao.imagens[2];
  document.getElementById("img4").src = legiao.imagens[3];
}

function proximo() {
  index = (index + 1) % legioes.length;
  atualizarTela();
}

function anterior() {
  index = (index - 1 + legioes.length) % legioes.length;
  atualizarTela();
}

atualizarTela();
</script>
</body>
</html>
