<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatação de Textos</title>
</head>
<body>
    <h1>Formatar Texto</h1>
    <h2>veja exemplos:</h2>
    <p>esse é um texto <b>negrito</b></p>
    <p>esse é um texto <strong>importante</strong></p>
    <p>esse é um texto <i>itálico</i></p>
    <p>esse é um texto <em>ênfase</em></p>
    <p>esse é um texto <mark>marcado</mark></p>
    <p>esse é um texto <u>sublinhado</u></p>
    <p>esse é um texto <del>deletado</del></p>
    <p>esse é um texto <sup>subrescrito</sup></p>
    <p>10<sup>2</sup>= 100</p>
    <p>esse é um texto <sub>subscrito</sub></p>
    <p>H<sub>2</sub>O</p>

</body>
</html>
