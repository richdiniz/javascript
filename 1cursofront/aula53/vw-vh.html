<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VW e VH</title>
    <style>
         
        .pixel{
            border: 1px solid black;
            background: red;
            padding:8px;
            width: 200px;
        }
        .porcentagem{
            border: 1px solid black;
            background: red;
            padding:8px;
            width: 25%;
        }
        .vw{
            border: 1px solid black;
            background: red;
            padding:8px;
            width: 25vw;
        }
        #area{
            border: 3px solid black;
            width: 500px;}
    </style>
</head>
<body>
    <div class="pixel">
        Pixel é a menor parte de ... <!--absoluta-->
    </div>
    <div class="porcentagem">
        Porcentagem (50%)<!--relativa- 50% em relação a body-->
    </div>
    <div class="vw">
        VW (50vw)<!--relativa- 50% em relação a tela visivel-->
    </div>
    <br>
    <hr>
    <br>
    <div id="area">
        <div class="pixel">
            Pixel é a menor parte de ... <!--absoluta-->
        </div>
        <div class="porcentagem">
            Porcentagem (50%)<!--relativa- 50% em relação a body-->
        </div>
        <div class="vw">
            VW (50vw)<!--relativa- 50% em relação a tela visivel-->
        </div>
    </div>
</body>
</html>
