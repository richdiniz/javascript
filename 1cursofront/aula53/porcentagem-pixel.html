        .pixel{

        }

            width: 470px;
        }

</head>
<body>
    <div class="pixel">
        Pixel é a menor parte de ... <!--absoluta-->

    <div class="porcentagem">
        Porcentagem (50%)<!--relativa- 50% em relação a  body-->
    </div>

    <hr>
    <br>

        <div class="pixel">
            Pixel é a menor parte de ... <!--absoluta-->
        </div>
        <div class="porcentagem">
            Porcentagem (50%)<!--relativa- 50% em relação a div area-->
        </div>
    </div>
