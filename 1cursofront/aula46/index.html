        h1{

            border-style: solid;
        }
        #A{
            border-width: 12px 4px 6px 30px; /*sempre sentido horário*/

        }

        #e{

        #f{
            border: 10px ridge #ffd900;

        /*ESTILOS:
        solid(linha normal)
        dashed(pontilhado)
        dotted(pontilhado com circulos)
        double(linha dupla)
        inset ou outset (reflexo simples)
        groove ou ridge (reflexo duplo)
        */
