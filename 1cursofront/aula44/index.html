<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            background-color: greenyellow;
            color: yellowgreen;
            padding: 10px;
            font-family: 'Times New Roman', Times, serif;
        }
        /*
    ---SITES para paleta de cores:
        -colors.co
        -color hunt

    ----formas de representar cor no css:
        -Nome(red)
        -Rgb(0,0,255)
        -Hexadecimal(#ffcd19)<-{FORMA MAIS INDICADA}
        -Hsl(240,100%,25%)[matriz, saturação, lightness]
        */
        h2{
            background-color: rgb(173, 255, 47);
            color: rgb(154, 205, 50);
            padding: 10px;
            font-family:'Courier New', Courier, monospace ;
        }
        h3{
            background-color: #adff2f;
            color: #9acd32;
            padding: 10px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        h4{
            background-color: hsl(84, 100%, 59%);
            color: hsl(80, 61%, 50%);
            padding: 10px;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }
    </style>
</head>
<body>
    <h1>fontes e cores</h1>
    <h2>fontes e cores</h2>
    <h3>fontes e cores</h3>
    <h4>fontes e cores</h4>
</body>
</html>
