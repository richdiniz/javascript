<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        td,table, th{
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>tabelas</h1>

    <table>
        <tr>
            <th>Herois</th><!-- Table header = cabeçalho da tabela-->
            <th>idade de inicio</th>
            <th>universo</th>
        </tr>
        <tr><!-- Table row = linha da tabela -->
            <td>batman</td><!-- Table data = dado da tabela -->
            <td>25</td>
            <td>dc</td>
        </tr>
        <tr>
            <td>homem ranha</td>
            <td>15</td>
            <td>marvel</td>
        </tr>
        <tr>
            <td>ben 10</td>
            <td>10</td>
            <td>cartoonnetwork</td>
        </tr>
        <tr>
            <td>MaxSteel</td>
            <td>19</td>
            <td>matel</td>
        </tr>
        <tr>
            <td>Invencivel</td>
            <td>17</td>
            <td>imagine comics</td>
        </tr>
        <tr>
            <td>Naruto</td>
            <td>12</td>
            <td>toei animation</td>
        </tr>
        <!--rowspan= ocupar quantas linhas-->
        <!--colspan= ocupar quantas colunas-->
        <tr>
            <td rowspan="2">média de idade/Qt de herois</td>
            <td colspan="2">a média entre eles é 16.3</td>
        </tr>
        <tr>
            <td colspan="2">6 herois</td>
        </tr>
    </table>
</body>
</html>
