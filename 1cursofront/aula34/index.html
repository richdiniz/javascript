<body>
    <!--
    site ideal para baixar videos(mp4) sem direito autoral é o pixabay
    -->
    <h1>executando videos</h1>
    <video width="339px" controls muted loop poster="../aula23x/imagens-exercicio/p1.jpeg">
        <source src="videos/abelhas.mp4" type="video/mp4">
        <!--
        é comum usar duas fontes de video caso uma funcione e outra não. ex:
        <source src="videos/abelhas.ogg" type="video/ogg">
        -->
    </video>
    <h2>video 2</h2>
    <video width="339px" controls muted autoplay poster="../aula23x/imagens-exercicio/p2.jpeg">
        <source src="https://youtu.be/OY9MqaDSbxw?si=0R8_Z2_fiPhmHYg3">
    </video>
    <!--usando iframe-->
    <iframe width="430px" height="200" frameborder="0" src="../aula25/index.html" ></iframe>
