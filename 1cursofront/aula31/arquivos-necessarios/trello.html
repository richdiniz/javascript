<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface de login do Trello</title>

    <!--
      <script src="https://unpkg.com/@codans/trello"></script>
    -->
      <script src="https://unpkg.com/@codans/trello"></script>

</head>
<body>
  <img src="img/trello.svg" width="200px" alt="">
  <h1>Fazer login</h1>
  <form action="" method="get">
    <input type="text" name="email" placeholder="Insira o e-mail">
    <input type="password" name="senha" placeholder="Insira sua senha">
    <input type="submit" value="Fazer login">
    <span>Ou</span>
    <button>
      <img src="img/google.svg" width="20px" alt="">
      continuar com o Google
    </button>
    <button>
      <img src="img/microsoft.svg" width="20px" alt="">
      continuar com o Microsoft
    </button>
    <button>
      <img src="img/apple.svg" width="20px" alt="">
      continuar com a Apple
    </button>
    <button>
      <img src="img/slack.svg" width="20px" alt="">
      continuar com o Slack
    </button>
  </form>

  <img src="img/atlassian.svg" alt="" width="200px">
  <img src="img/analytics.svg" alt="" width="200px">
  <img src="img/interactive.svg" alt="" width="200px">
</body>
</html>
