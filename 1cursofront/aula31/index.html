<form action="../aula28/processa.html">
    <h1>Exercicio de formulario</h1>
    <fieldset>
        <legend>Dados pessoais</legend>
        <label for="nome">nome:</label>
        <input type="nome" name="nome" id="nome"><br>

        <label for="email">Email:</label>
        <input type="text" name="email" id="email"><br>

        <label for="receber_email">Quero receber e-mail's</label><br><br>

    </fieldset>
    <fieldset>
        <legend>Informações adicionais</legend>
        <input type="radio" name="tipo_pesoa" id="pf" value="PF">
        <label for="pf">Pessoa Física</label>
        <input type="radio" name="tipo_pesoa" id="pj" value="PJ">
        <label for="pj">Pessoa Jurídica</label>
    </fieldset>
    <br>
    <input type="submit" value="Cadastrar">
